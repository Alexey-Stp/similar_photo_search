<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- SimilarPhotos app icon, source for SimilarPhotos/Assets.xcassets/AppIcon.appiconset/AppIcon.png.
       Two shots of the same face: the one with closed eyes is marked for deletion (red), the smiling one is
       kept (green check). Full square, no rounding: iOS applies the icon mask. -->
  <defs>
    <clipPath id="photo">
      <rect x="30" y="30" width="340" height="360" rx="30"/>
    </clipPath>
    <!-- one print: white frame, sky, shoulders, hair, head; the face features are added per print -->
    <g id="print">
      <rect x="0" y="0" width="400" height="480" rx="52" fill="#f5f3ee"/>
      <rect x="30" y="30" width="340" height="360" rx="30" fill="#8fb3c9"/>
      <g clip-path="url(#photo)">
        <ellipse cx="200" cy="420" rx="150" ry="110" fill="#3f5d6b"/>
        <circle cx="200" cy="176" r="98" fill="#3b2a20"/>
        <circle cx="200" cy="202" r="86" fill="#f2c9a0"/>
      </g>
    </g>
  </defs>
  <rect width="1024" height="1024" fill="#121216"/>

  <!-- the duplicate: eyes closed -->
  <g transform="translate(140 300) rotate(-9 200 240)">
    <use href="#print"/>
    <path d="M150 196 Q166 210 182 196 M218 196 Q234 210 250 196" fill="none" stroke="#1c1c1e"
          stroke-width="9" stroke-linecap="round"/>
    <path d="M178 246 L222 246" fill="none" stroke="#1c1c1e" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- the keeper: eyes open, smiling -->
  <g transform="translate(480 236) rotate(7 200 240)">
    <use href="#print"/>
    <circle cx="166" cy="194" r="12" fill="#1c1c1e"/>
    <circle cx="234" cy="194" r="12" fill="#1c1c1e"/>
    <path d="M158 234 Q200 276 242 234" fill="none" stroke="#1c1c1e" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- delete badge on the duplicate -->
  <circle cx="214" cy="744" r="96" fill="#ff453a" stroke="#121216" stroke-width="24"/>
  <path d="M180 710 L248 778 M248 710 L180 778" fill="none" stroke="#ffffff" stroke-width="30"
        stroke-linecap="round"/>

  <!-- keep badge on the keeper -->
  <circle cx="826" cy="712" r="110" fill="#30d158" stroke="#121216" stroke-width="24"/>
  <path d="M772 714 L812 754 L884 676" fill="none" stroke="#000000" stroke-width="32"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
