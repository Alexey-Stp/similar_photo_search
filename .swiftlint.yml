included:
  - SimilarPhotos
  - Packages

excluded:
  - Packages/Domain/.build
  - Packages/Data/.build
  - Packages/Presentation/.build

# Zero-network guard rails (CLAUDE.md rule #1, SPS-5). Each line of scripts/fixtures/NetworkViolations.swift
# declares which of these rules must fire on it (`// expect: <rule>` or `// expect: none`);
# scripts/check-swiftlint-fixture.sh verifies that line by line in CI. Update the fixture when you change a regex.
custom_rules:
  no_network_apis:
    name: "Zero network"
    regex: '\b(URLSession\w*|URLRequest|NSURLConnection|NWConnection|NWPathMonitor|NWBrowser|NWListener|WKWebView|SFSafariViewController|ASWebAuthenticationSession|AsyncImage|CFNetwork\w*|CFStream\w*|CFHTTP\w*)\b'
    message: "Networking APIs are forbidden (CLAUDE.md rule #1)."
    severity: error
  no_network_frameworks:
    name: "Zero network frameworks"
    # [ \t] instead of \s so a match never starts on a previous blank line (wrong line in the report).
    regex: '^[ \t]*(@\w+[ \t]+)*import[ \t]+(Network|WebKit|SafariServices|CFNetwork|CloudKit|MultipeerConnectivity)\b'
    message: "Network, WebKit, SafariServices, CFNetwork, CloudKit and MultipeerConnectivity are forbidden (CLAUDE.md rule #1)."
    severity: error
  no_socket_calls:
    name: "Zero network sockets"
    # Direct BSD socket and resolver calls (SPS-30). The match is only the function name, so `match_kinds` drops it in
    # comments and strings. It fires on a free call or one qualified with `Darwin.`/`Glibc.`, and only when the
    # arguments are unlabelled and as many as the C function takes: at least 3 (two top-level commas; commas nested up
    # to two parentheses deep don't count) for all but gethostbyname2 (2) and gethostbyname (1). So a method called
    # through implicit self with fewer arguments (`connect(1)`, `connect(fd, address)`) stays legal. Also not matched:
    # member calls (`client.connect(to:)`, `publisher.connect()`), labelled calls (`connect(to: host)`), `func`/`case`
    # declarations, and longer names (`reconnect(`, `socketPair(`).
    regex: '(?:(?<=\bDarwin\.)|(?<=\bGlibc\.)|(?<![\w.]))(?<!\b(?:func|case)[ \t]{1,16})\b(?:gethostbyname(?=[ \t]*\((?!\s*\))(?!\s*\w+(?:\s+\w+)?\s*:))|gethostbyname2(?=[ \t]*\((?!\s*\))(?!\s*\w+(?:\s+\w+)?\s*:)(?:[^,()]|\((?:[^()]|\([^()]*\))*\))*,)|(?:socket|connect|getaddrinfo|gethostbyaddr|getnameinfo|sendto|recvfrom)(?=[ \t]*\((?!\s*\))(?!\s*\w+(?:\s+\w+)?\s*:)(?:(?:[^,()]|\((?:[^()]|\([^()]*\))*\))*,){2}))'
    match_kinds:
      - identifier
    message: "Direct socket and DNS calls (socket, connect, getaddrinfo, gethostbyname, ...) are forbidden (CLAUDE.md rule #1)."
    severity: error
  no_icloud_downloads:
    name: "No iCloud downloads"
    # 1) Any assignment whose right-hand side is not exactly the literal `false`, followed only by end of line,
    #    `;`, `}` or a `//` comment: true, YES, a variable, !false, `false || allow`, `false /* x */ || allow`...
    #    Comparisons (==, !=) are fine.
    # 2) Any member access on the property, e.g. `options.isNetworkAccessAllowed.toggle()`.
    # 3) Passing it inout: `flip(&options.isNetworkAccessAllowed)` (but not `a && options.isNetworkAccessAllowed`).
    # 4) Any key path to the property (`\.isNetworkAccessAllowed`, `\PHImageRequestOptions.isNetworkAccessAllowed`),
    #    because key-path writes (`options[keyPath: ...] = true`) would bypass rule 1.
    regex: 'isNetworkAccessAllowed[ \t]*+=(?!=)[ \t]*+(?!false[ \t]*+(?:\r?\n|$|;|//|\}))|isNetworkAccessAllowed[ \t]*+\.|(?<!&)&(?![&=])[\w.]*\bisNetworkAccessAllowed\b|\\[\w.]*\.isNetworkAccessAllowed\b'
    message: "Only `isNetworkAccessAllowed = false` (literal, no block comment after it) is allowed: no other values, toggle(), inout or key paths. iCloud-only originals are skipped, never downloaded (CLAUDE.md rule #1)."
    severity: error
  no_remote_url_literals:
    name: "No remote URLs"
    regex: '(?i)\b(https?|wss?|ftp)://'
    match_kinds:
      - string
    message: "Remote URL literals are forbidden: the app must not load anything from the network (CLAUDE.md rule #1). If a link only opens in another app (e.g. a privacy policy in Safari), disable this rule for that line with a justification."
    severity: error
