name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "16.4"

jobs:
  lint:
    name: Lint & architecture guards
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Domain import boundary
        run: bash scripts/check-domain-imports.sh

      - name: Composition root boundary
        run: bash scripts/check-concrete-construction.sh

      - name: Allowed dependencies
        run: bash scripts/check-dependencies.sh

      - name: Info.plist usage keys
        run: bash scripts/check-info-plist.sh SimilarPhotos/Info.plist

      - name: Entitlements (no networking entitlements anywhere)
        run: bash scripts/check-entitlements.sh

      - name: Privacy manifest
        run: bash scripts/check-privacy-manifest.sh

      # Self-tests: every guard must reject its negative fixture *with the intended diagnostic*
      # (scripts/expect-failure.sh), so an unrelated error cannot make a self-test pass.
      - name: Info.plist check self-tests
        run: |
          f=scripts/fixtures
          bash scripts/expect-failure.sh --expect "missing required key NSPhotoLibraryUsageDescription" \
            -- bash scripts/check-info-plist.sh "$f/Info-missing-key.plist"
          bash scripts/expect-failure.sh --expect "must not contain NSAppTransportSecurity" \
            --absent "missing required key" -- bash scripts/check-info-plist.sh "$f/Info-ats-exception.plist"
          bash scripts/expect-failure.sh --expect "must not contain fetch in UIBackgroundModes" \
            --absent "missing required key" -- bash scripts/check-info-plist.sh "$f/Info-background-fetch.plist"

      - name: Entitlements check self-tests
        run: |
          f=scripts/fixtures
          # A *.entitlements file outside the app folder.
          bash scripts/expect-failure.sh --expect "Config/App.entitlements grants a networking entitlement" \
            -- bash scripts/check-entitlements.sh "$f/entitlements-forbidden"
          # A configured path with $(SRCROOT), a space and a non-.entitlements extension, deep in the mapping.
          bash scripts/expect-failure.sh --expect "Signing/App Entitlements.plist grants a networking entitlement" \
            -- bash scripts/check-entitlements.sh "$f/entitlements-configured"
          # Positive: networking keys that only appear in an XML comment are ignored.
          bash scripts/check-entitlements.sh "$f/entitlements-commented"

      - name: Privacy manifest check self-tests
        run: |
          f=scripts/fixtures
          bash scripts/expect-failure.sh --expect "NSPrivacyTracking must be false" \
            -- bash scripts/check-privacy-manifest.sh "$f/PrivacyInfo-tracking.xcprivacy"
          bash scripts/expect-failure.sh --expect "NSPrivacyCollectedDataTypes must be an empty array" \
            -- bash scripts/check-privacy-manifest.sh "$f/PrivacyInfo-collects-data.xcprivacy"
          bash scripts/expect-failure.sh --expect "sources use a NSPrivacyAccessedAPICategoryUserDefaults API" \
            -- bash scripts/check-privacy-manifest.sh "$f/PrivacyInfo-missing-userdefaults.xcprivacy"
          bash scripts/expect-failure.sh --expect "'XXXX.1' is not an approved reason code" \
            -- bash scripts/check-privacy-manifest.sh "$f/PrivacyInfo-bad-reason.xcprivacy"
          # A malformed entry is reported, and the valid UserDefaults entry after it is still found.
          bash scripts/expect-failure.sh --expect "NSPrivacyAccessedAPITypes[0] is malformed" \
            --absent "sources use a NSPrivacyAccessedAPICategoryUserDefaults API" \
            -- bash scripts/check-privacy-manifest.sh "$f/PrivacyInfo-malformed-entry.xcprivacy"

      - name: Dependency check self-tests
        run: |
          bash scripts/expect-failure.sh --expect "analytics-sdk.git is not in allowed-packages.txt" \
            -- bash scripts/check-dependencies.sh scripts/fixtures/resolved-forbidden
          # Positive: a multi-entry allow-list keeps its entries distinct and accepts both packages.
          ALLOWED_PACKAGES_FILE=scripts/fixtures/resolved-allowed/allowed-packages.txt \
            bash scripts/check-dependencies.sh scripts/fixtures/resolved-allowed
          # A missing allow-list aborts instead of being treated as empty.
          ALLOWED_PACKAGES_FILE=scripts/fixtures/does-not-exist.txt \
            bash scripts/expect-failure.sh --expect "is missing or unreadable" -- bash scripts/check-dependencies.sh

      - name: SwiftLint
        run: |
          command -v swiftlint >/dev/null || brew install swiftlint
          swiftlint --strict --reporter github-actions-logging

      - name: SwiftLint zero-network rules self-test (line by line)
        run: bash scripts/check-swiftlint-fixture.sh

  test:
    name: Build & test
    # A healthy run takes about 5 minutes; a hung test must not hold a runner for the 6-hour default. Leaves room for
    # both test steps' own limits (10 + 20 min) plus setup, including a possible iOS platform download.
    timeout-minutes: 60
    needs: lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"

      - name: Package tests (Domain, Data)
        timeout-minutes: 10
        run: |
          swift test --package-path Packages/Domain -Xswiftc -warnings-as-errors
          swift test --package-path Packages/Data -Xswiftc -warnings-as-errors

      - name: Generate Xcode project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate

      - name: Allowed dependencies (resolved, including transitive)
        run: |
          xcodebuild -resolvePackageDependencies -project SimilarPhotos.xcodeproj -scheme SimilarPhotos
          bash scripts/check-dependencies.sh

      # Runner images don't always ship an "iPhone 16" (or any iOS runtime) for the selected Xcode, so pick an
      # available iPhone simulator by UDID, create one if needed, and download the iOS platform as a last resort.
      - name: Pick iOS simulator
        run: |
          set -euo pipefail
          first_iphone() {
            xcrun simctl list devices available --json | jq -r '
              [.devices | to_entries[] | select(.key | contains("SimRuntime.iOS")) | .value[]
               | select(.name | startswith("iPhone"))]
              | (map(select(.name == "iPhone 16")) + .) | first | .udid // empty'
          }
          udid=$(first_iphone)
          if [ -z "$udid" ]; then
            runtime=$(xcrun simctl list runtimes available --json \
              | jq -r '[.runtimes[] | select(.platform == "iOS")] | last | .identifier // empty')
            if [ -z "$runtime" ]; then
              echo "No iOS simulator runtime for Xcode ${XCODE_VERSION}; downloading the iOS platform"
              xcodebuild -downloadPlatform iOS
              runtime=$(xcrun simctl list runtimes available --json \
                | jq -r '[.runtimes[] | select(.platform == "iOS")] | last | .identifier // empty')
            fi
            [ -n "$runtime" ] || { echo "::error::No iOS simulator runtime available"; exit 1; }
            device_type=$(xcrun simctl list devicetypes --json \
              | jq -r '[.devicetypes[] | select(.name | startswith("iPhone"))]
                      | (map(select(.name == "iPhone 16")) + reverse) | first | .identifier')
            udid=$(xcrun simctl create "CI iPhone" "$device_type" "$runtime")
          fi
          echo "Using simulator $udid"
          echo "SIMULATOR_DESTINATION=platform=iOS Simulator,id=$udid" >> "$GITHUB_ENV"

      - name: xcodebuild test
        timeout-minutes: 20
        run: |
          set -o pipefail
          xcodebuild test \
            -project SimilarPhotos.xcodeproj \
            -scheme SimilarPhotos \
            -destination "$SIMULATOR_DESTINATION" \
            -resultBundlePath TestResults.xcresult \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
